name: Rust and Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 10
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo fmt --all -- --check
      - name: Check native storage capture protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/standalone-checks
          EXE=
          if [ "$RUNNER_OS" = Windows ]; then EXE=.exe; fi
          rustfmt --edition 2024 --check tools/ios-native-storage-output-gate.rs
          rustc --edition 2024 --test tools/ios-native-storage-output-gate.rs -o "target/standalone-checks/native-storage-output-tests$EXE"
          "target/standalone-checks/native-storage-output-tests$EXE"
      - run: cargo nextest run --locked --workspace --features desktop-preview --test-threads 10
      - run: cargo test --locked --workspace --features desktop-preview --doc
      - run: cargo clippy --locked --workspace --all-targets --features desktop-preview -- -D warnings
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;30.0.14904198' 'platforms;android-36' 'build-tools;36.1.0'
      - name: Compile both Android ABIs
        shell: bash
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          cargo clippy --locked --target aarch64-linux-android --lib --no-deps -- -D warnings
          cargo clippy --locked --target x86_64-linux-android --lib --no-deps -- -D warnings
          cargo build --locked --target aarch64-linux-android --lib
          cargo build --locked --target x86_64-linux-android --lib
      - name: Verify VM bridges and resource compilation
        run: |
          cargo run --locked -p android-bridge -- bridge-classes
          javap -p -c -classpath bridge-classes com.autodevjapan.phonefrictioncontrol.ControlService
          mkdir bridge-dex
          java -cp "$ANDROID_HOME/build-tools/36.1.0/lib/d8.jar" com.android.tools.r8.D8 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 26 --output bridge-dex bridge-classes/com/autodevjapan/phonefrictioncontrol/*.class
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" compile --dir android/res -o resources.zip
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" link -o resources.apk --manifest android/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" --debug-mode resources.zip
      - name: Assemble and verify a debug APK
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 30
          cargo run --locked -p android-bridge -- pack . target/x86_64-linux-android/debug/libphone_friction_control.so x86_64 apk-out
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile and distinguish advertising native variants
        shell: bash
        run: |
          mkdir ci-native
          cp target/x86_64-linux-android/debug/libphone_friction_control.so ci-native/plain.so
          NDK_BIN="$ANDROID_HOME/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar" AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          for FEATURE in ads-test ads-production; do
            cargo clippy --locked --target aarch64-linux-android --lib --features "$FEATURE" --no-deps -- -D warnings
            cargo clippy --locked --target x86_64-linux-android --lib --features "$FEATURE" --no-deps -- -D warnings
            cargo build --locked --target x86_64-linux-android --lib --features "$FEATURE"
            cp target/x86_64-linux-android/debug/libphone_friction_control.so "ci-native/$FEATURE.so"
          done
          if cargo check --locked --target x86_64-linux-android --lib --features ads-test,ads-production > mixed-features.log 2>&1; then exit 1; fi
          grep 'ads-test and ads-production are mutually exclusive' mixed-features.log
          target/debug/android-bridge pack-ads . ci-native/ads-test.so x86_64 ads-test-apk gradle
          if target/debug/android-bridge pack-ads . ci-native/ads-production.so x86_64 production-as-test gradle; then exit 1; fi
          test ! -e production-as-test
      - name: Verify release packaging with an ephemeral signer
        shell: bash
        run: |
          export PHONE_CONTROL_KS_PASS="$(openssl rand -hex 32)"
          export PHONE_CONTROL_KEY_PASS="$PHONE_CONTROL_KS_PASS"
          keytool -genkeypair -keystore fixture.p12 -alias fixture -storepass:env PHONE_CONTROL_KS_PASS -keypass:env PHONE_CONTROL_KEY_PASS -dname 'CN=AutoDevJapan Release Fixture' -keyalg RSA -keysize 3072 -validity 30
          keytool -exportcert -keystore fixture.p12 -alias fixture -storepass:env PHONE_CONTROL_KS_PASS -file fixture.der
          PIN=$(sha256sum fixture.der | cut -d ' ' -f1)
          LIB=ci-native/plain.so
          target/debug/android-bridge pack-release . "$LIB" x86_64 release3 fixture.p12 fixture 3 0.3.0 "$PIN"
          target/debug/android-bridge pack-release . "$LIB" x86_64 release4 fixture.p12 fixture 4 0.3.1 "$PIN"
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging release4/phone-control-x86_64-release.apk > release-badging.txt
          if grep -q '^application-debuggable' release-badging.txt; then exit 1; fi
          grep "versionCode='4'" release-badging.txt
          if target/debug/android-bridge pack-release . "$LIB" x86_64 wrong-pin fixture.p12 fixture 5 0.3.2 "$(printf '0%.0s' {1..64})"; then exit 1; fi
          test ! -e wrong-pin/phone-control-x86_64-release.apk
          # These IDs are syntax fixtures, not registered AdMob IDs. Never install/run this APK.
          APP_ID=ca-app-pub-1234567890123456~1234567890
          BANNER_ID=ca-app-pub-1234567890123456/9876543210
          target/debug/android-bridge pack-ads-release . ci-native/ads-production.so x86_64 ads-release gradle fixture.p12 fixture 6 0.4.0-fixture "$PIN" "$APP_ID" "$BANNER_ID"
          ADS_APK=ads-release/phone-control-x86_64-ads-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree "$ADS_APK" --file AndroidManifest.xml > ads-manifest.txt
          grep "$APP_ID" ads-manifest.txt
          grep "$BANNER_ID" ads-manifest.txt
          if grep -q 3940256099942544 ads-manifest.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "$ADS_APK" > ads-badging.txt
          grep "versionCode='6'" ads-badging.txt
          if grep -q '^application-debuggable' ads-badging.txt; then exit 1; fi
          if target/debug/android-bridge pack-ads-release . ci-native/ads-test.so x86_64 test-as-production gradle fixture.p12 fixture 6 0.4.0 "$PIN" "$APP_ID" "$BANNER_ID"; then exit 1; fi
          test ! -e test-as-production
          if target/debug/android-bridge pack-ads-release . ci-native/ads-production.so x86_64 sample-reject gradle fixture.p12 fixture 6 0.4.0 "$PIN" ca-app-pub-3940256099942544~3347511713 ca-app-pub-3940256099942544/9214589741; then exit 1; fi
          test ! -e sample-reject
          if target/debug/android-bridge pack-ads-release . ci-native/ads-production.so x86_64 ads-wrong-pin gradle fixture.p12 fixture 6 0.4.0 "$(printf '0%.0s' {1..64})" "$APP_ID" "$BANNER_ID"; then exit 1; fi
          test ! -e ads-wrong-pin/phone-control-x86_64-ads-release.apk
          BEFORE=$(sha256sum "$ADS_APK")
          if target/debug/android-bridge pack-ads-release . ci-native/ads-production.so x86_64 ads-release gradle fixture.p12 fixture 7 0.4.1 "$PIN" "$APP_ID" "$BANNER_ID"; then exit 1; fi
          test "$BEFORE" = "$(sha256sum "$ADS_APK")"
          export PHONE_CONTROL_KS_PASS=android PHONE_CONTROL_KEY_PASS=android
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass:env PHONE_CONTROL_KS_PASS -file debug.der
          DEBUG_PIN=$(sha256sum debug.der | cut -d ' ' -f1)
          if target/debug/android-bridge pack-release . "$LIB" x86_64 debug-reject "$HOME/.android/debug.keystore" androiddebugkey 5 0.3.2 "$DEBUG_PIN"; then exit 1; fi
          test ! -e debug-reject/phone-control-x86_64-release.apk
          unset PHONE_CONTROL_KS_PASS PHONE_CONTROL_KEY_PASS
