[package]
name = "phone-friction-control"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[lib]
name = "phone_friction_control"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phone-friction-control-preview"
path = "src/main.rs"
required-features = ["desktop-preview"]

[features]
default = []
desktop-preview = ["winit/default"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["android-native-activity", "default_fonts", "glow", "persistence"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["android-native-activity"] }
serde = { version = "1", features = ["derive"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.21.1"

[package.metadata.android]
package = "com.autodevjapan.phonefrictioncontrol"
apk_name = "phone-friction-control"
build_targets = ["aarch64-linux-android"]
manifest_override = "android/AndroidManifest.xml"
strip = "strip"
include_cplusplus_shared = true

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
